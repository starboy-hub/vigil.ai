<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vigil AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header: Vigil AI branding + Settings Gear icon -->
    <header class="header">
      <div class="brand">
        <svg class="brand-shield" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <polyline points="9 12 11 14 15 10"/>
        </svg>
        <h1 class="brand-title">Vigil AI</h1>
      </div>
      <button id="openOptions" class="icon-button" aria-label="Open Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Main Status: Minimalist at-a-glance dashboard -->
    <main class="main-status">
      <div class="status-card">
        <div class="status-icon-wrap" aria-hidden="true">
          <svg class="shield-pulse" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polyline points="9 12 11 14 15 10"/>
          </svg>
        </div>
        <div class="counter-display">
          <div id="threatCount" class="counter-number">0</div>
          <div id="threatLabel" class="counter-label">Threats Blocked Today</div>
        </div>
        <div class="status-badge" id="protectionBadge">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Protection Active</span>
        </div>
      </div>

      <!-- Action Button: Pause Protection (1 Hour) -->
      <div class="action-wrapper">
        <button id="pauseButton" class="pause-button" aria-live="polite">
          Pause Protection (1 Hour)
        </button>
      </div>

      <!-- Recent Activity: Last 3 blocked/masked items -->
      <section class="activity-section" aria-labelledby="activityTitle">
        <h2 id="activityTitle" class="section-title">Recent Activity</h2>
        <ul id="activityList" class="activity-list" role="list">
          <li class="activity-empty">No activity recorded today</li>
        </ul>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span class="footer-badge">Local-First</span>
      <span class="footer-text">Zero-Cloud Privacy Engine</span>
    </footer>
  </div>

  <script src="vigil-shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
