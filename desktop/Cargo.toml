[package]
name = "vigil-desktop-companion"
version = "1.0.0"
edition = "2021"
authors = ["Vigil AI Security Team <temur.khalid@gmail.com>"]
license = "AGPL-3.0-or-later"
description = "Vigil AI Native Desktop Security Companion: Native Messaging Host, E2E-Encrypted Channel, OS Keychain, Audio Spectral Canary, SIEM Export"

[lib]
name = "vigil_desktop_companion"
path = "src/lib.rs"

[[bin]]
name = "vigil-desktop-companion"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
keyring = "=2.3.3"
rustfft = "=6.4.1"
byteorder = "=1.5.0"
regex = "=1.13.1"
lazy_static = "=1.5.1"
dirs-next = "=2.0.0"
sha2 = "=0.10.9"
hex = "=0.4.3"
aes-gcm = "=0.10.3"
p256 = { version = "=0.13.2", features = ["ecdh"] }
rand = "=0.8.8"
zeroize = "=1.9.0"
base64 = "=0.22.1"
ureq = { version = "=2.12.1", features = ["json"] }
