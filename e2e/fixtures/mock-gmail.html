<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Inbox - Gmail</title></head>
<body>
  <h1>Gmail</h1>
  <div id="messages">
    <table><tbody>
      <tr>
        <td><span email="global.bank.alert@gmail.com">Global Bank Security</span></td>
        <td><span class="bog">Your account will be suspended today</span></td>
        <td><div class="y6">URGENT: verify your password and provide your card number immediately, or lose access forever.</div></td>
      </tr>
      <tr>
        <td><span email="sarah@family.com">Sarah</span></td>
        <td><span class="bog">Weekend plans</span></td>
        <td><div class="y6">Are we still on for dinner on Friday? I will bring the salad.</div></td>
      </tr>
    </tbody></table>
  </div>
</body>
</html>
